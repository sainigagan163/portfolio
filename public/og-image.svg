  <text x="269" y="519" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#14b8a6" text-anchor="middle">Azure</text>
  <rect x="308" y="500" width="50" height="28" rx="4" fill="#14b8a610" stroke="#14b8a640" stroke-width="1"/>
  <text x="333" y="519" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#14b8a6" text-anchor="middle">GCP</text>
  <rect x="368" y="500" width="36" height="28" rx="4" fill="#14b8a610" stroke="#14b8a640" stroke-width="1"/>
