  <text x="100" y="410" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#94a3b8">across AWS, Azure, and GCP.</text>
  <!-- Location -->
  <text x="100" y="470" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#64748b">Aberdeen, UK — gagansaini.dev</text>
  <!-- Tech tags -->
  <rect x="100" y="500" width="70" height="28" rx="4" fill="#14b8a610" stroke="#14b8a640" stroke-width="1"/>
  <text x="135" y="519" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#14b8a6" text-anchor="middle">Python</text>
  <rect x="180" y="500" width="50" height="28" rx="4" fill="#14b8a610" stroke="#14b8a640" stroke-width="1"/>
  <text x="205" y="519" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#14b8a6" text-anchor="middle">AWS</text>
